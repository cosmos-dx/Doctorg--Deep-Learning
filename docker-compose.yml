version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: doctorg-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doctorg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doctorg_password}
      POSTGRES_DB: ${POSTGRES_DB:-doctorg_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctorg"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doctorg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctorg-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doctorg}:${POSTGRES_PASSWORD:-doctorg_password}@postgres:5432/${POSTGRES_DB:-doctorg_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      POSTGRES_USER: ${POSTGRES_USER:-doctorg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doctorg_password}
      POSTGRES_DB: ${POSTGRES_DB:-doctorg_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doctorg-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
